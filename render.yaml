# Render Blueprint for a free DEMO deployment.
# Use demo data only: Render is not approved for real employee data.
databases:
  - name: vacation-planner-db
    plan: free
    databaseName: vacation_planner
    user: vacation_planner

services:
  - type: web
    name: vacation-planner
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vacation-planner-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Password for every demo login. Read it in the Render dashboard (Environment tab).
      - key: DEMO_PASSWORD
        generateValue: true
      - key: DEMO_SEED
        value: "1"
      - key: DJANGO_BEHIND_PROXY
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
